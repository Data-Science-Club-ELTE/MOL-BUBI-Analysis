name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Check code formatting and linting
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Validate fixture data contracts
        run: |
          uv run python scripts/generate_fixtures.py

      # Scoring and corridor ranking decide the demo order (#78): run them first, offline
      # (the no_network fixture fails any download) and within a hard 60 s limit.
      - name: Corridor scoring tests (offline, 60 s limit)
        run: |
          timeout 60 uv run pytest tests/test_corridors.py tests/test_corridor_volumes.py tests/test_corridors_ci.py -q

      - name: Run test suite
        run: |
          uv run pytest tests/ -v
