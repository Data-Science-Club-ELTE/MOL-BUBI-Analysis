<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1240" width="1280" height="1240" font-family="Helvetica, Arial, sans-serif">
  <style>
    .frame { fill: #ffffff; stroke: #555; stroke-width: 1.5; }
    .box { fill: #f4f4f4; stroke: #888; stroke-width: 1; }
    .box-dark { fill: #e6e6e6; stroke: #888; stroke-width: 1; }
    .map { fill: #eef1ee; stroke: #888; stroke-width: 1; }
    .ph { fill: none; stroke: #aaa; stroke-width: 1; stroke-dasharray: 5 4; }
    .t { font-size: 13px; fill: #222; }
    .ts { font-size: 11px; fill: #555; }
    .th { font-size: 15px; font-weight: bold; fill: #111; }
    .tl { font-size: 18px; font-weight: bold; fill: #111; }
    .num { font-size: 12px; font-weight: bold; fill: #fff; }
    .call { fill: #d9480f; }
    .road { stroke: #b8b8b8; stroke-width: 3; fill: none; }
    .lane { stroke: #2b8a3e; stroke-width: 4; fill: none; }
    .gap { stroke: #d9480f; stroke-width: 6; fill: none; }
  </style>

  <!-- Window -->
  <rect class="frame" x="10" y="10" width="1260" height="1220" rx="6"/>

  <!-- Header -->
  <rect class="box-dark" x="10" y="10" width="1260" height="56" rx="6"/>
  <text class="tl" x="26" y="44">MOL Bubi Bike-Lane &amp; Station Recommendation Tool</text>
  <rect x="1010" y="24" width="240" height="28" rx="14" fill="#fff3bf" stroke="#c99a06"/>
  <text class="t" x="1024" y="43">Synthetic demo data (D5) · fixtures</text>
  <circle class="call" cx="1000" cy="38" r="10"/><text class="num" x="996" y="42">1</text>

  <!-- Sidebar -->
  <rect class="box" x="10" y="66" width="240" height="1164"/>
  <circle class="call" cx="232" cy="88" r="10"/><text class="num" x="228" y="92">2</text>
  <text class="th" x="26" y="94">Scenario</text>
  <circle cx="34" cy="116" r="6" fill="#222"/><text class="t" x="48" y="120">baseline</text>
  <circle cx="34" cy="140" r="6" fill="none" stroke="#222"/><text class="t" x="48" y="144">lane_aware</text>
  <circle cx="34" cy="164" r="6" fill="none" stroke="#222"/><text class="t" x="48" y="168">population_only</text>
  <rect x="26" y="182" width="12" height="12" fill="none" stroke="#222"/>
  <text class="t" x="46" y="193">Show difference vs baseline</text>

  <line x1="26" y1="212" x2="234" y2="212" stroke="#ccc"/>
  <circle class="call" cx="232" cy="234" r="10"/><text class="num" x="228" y="238">3</text>
  <text class="th" x="26" y="240">Map layers</text>
  <text class="ts" x="26" y="262">Basemap</text>
  <rect fill="#fff" stroke="#888" x="26" y="270" width="200" height="26" rx="4"/>
  <text class="t" x="36" y="288">OpenStreetMap</text><text class="t" x="208" y="288">▾</text>
  <text class="ts" x="26" y="312">or Light grey (Esri), both keyless</text>
  <g class="t">
    <rect x="26" y="326" width="12" height="12" fill="#222"/><text x="46" y="337">Existing stations</text>
    <rect x="26" y="350" width="12" height="12" fill="#222"/><text x="46" y="361">Proposed stations</text>
    <rect x="26" y="374" width="12" height="12" fill="none" stroke="#222"/><text x="46" y="385">Population (H3 cells)</text>
    <rect x="26" y="398" width="12" height="12" fill="#222"/><text x="46" y="409">Bike-lane coverage</text>
    <rect x="26" y="422" width="12" height="12" fill="none" stroke="#222"/><text x="46" y="433">Synthetic routes</text>
    <rect x="26" y="446" width="12" height="12" fill="#222"/><text x="46" y="457">Top corridors</text>
  </g>
  <text class="ts" x="26" y="482">Top corridors to show</text>
  <line x1="26" y1="496" x2="234" y2="496" stroke="#888" stroke-width="2"/>
  <circle cx="110" cy="496" r="7" fill="#222"/>
  <text class="ts" x="104" y="516">10</text>

  <line x1="26" y1="534" x2="234" y2="534" stroke="#ccc"/>
  <text class="th" x="26" y="560">Run parameters</text>
  <text class="ts" x="26" y="582">Read-only, from config file</text>
  <text class="t" x="26" y="604">Walk coverage: 350 m</text>
  <text class="t" x="26" y="624">Proposed stations N: 10</text>
  <text class="t" x="26" y="644">Min spacing: 400 m</text>
  <text class="t" x="26" y="664">Seed: 42 · H3 res 9</text>
  <text class="t" x="26" y="684">OSM graph: 2026w1</text>

  <line x1="26" y1="704" x2="234" y2="704" stroke="#ccc"/>
  <circle class="call" cx="232" cy="726" r="10"/><text class="num" x="228" y="730">4</text>
  <text class="th" x="26" y="732">Exports</text>
  <rect class="box-dark" x="26" y="746" width="200" height="28" rx="4"/><text class="t" x="40" y="765">Corridors (GeoJSON / CSV)</text>
  <rect class="box-dark" x="26" y="782" width="200" height="28" rx="4"/><text class="t" x="40" y="801">Stations (GeoJSON / CSV)</text>

  <text class="ts" x="26" y="1210">All numbers here are placeholders.</text>

  <!-- KPI row -->
  <circle class="call" cx="1252" cy="86" r="10"/><text class="num" x="1248" y="90">5</text>
  <g>
    <rect class="box" x="266" y="80" width="236" height="66" rx="4"/>
    <text class="ts" x="280" y="102">Stations (existing + proposed)</text><text class="tl" x="280" y="132">220 + 10</text>
    <rect class="box" x="514" y="80" width="236" height="66" rx="4"/>
    <text class="ts" x="528" y="102">Newly served population</text><text class="tl" x="528" y="132">+ 18 400</text>
    <rect class="box" x="762" y="80" width="236" height="66" rx="4"/>
    <text class="ts" x="776" y="102">Corridor km needed</text><text class="tl" x="776" y="132">12.4 km</text>
    <rect class="box" x="1010" y="80" width="230" height="66" rx="4"/>
    <text class="ts" x="1024" y="102">Synthetic trips</text><text class="tl" x="1024" y="132">48 000</text>
  </g>

  <!-- Map: full width -->
  <rect class="map" x="266" y="160" width="974" height="400" rx="4"/>
  <circle class="call" cx="282" cy="178" r="10"/><text class="num" x="278" y="182">6</text>
  <text class="th" x="300" y="184">Main map (Folium, full width)</text>
  <path class="road" d="M300 520 L520 380 L780 300 L1060 220"/>
  <path class="road" d="M380 240 L580 330 L720 460 L860 545"/>
  <path class="road" d="M640 190 L680 330 L700 545"/>
  <path class="road" d="M900 545 L960 400 L1060 220"/>
  <path class="lane" d="M300 520 L520 380"/>
  <path class="lane" d="M640 190 L680 330"/>
  <path class="lane" d="M900 545 L960 400"/>
  <path class="gap" d="M520 380 L780 300"/>
  <path class="gap" d="M580 330 L720 460"/>
  <g fill="#1c7ed6" stroke="#fff" stroke-width="1.5">
    <circle cx="520" cy="380" r="7"/><circle cx="680" cy="330" r="7"/><circle cx="780" cy="300" r="7"/><circle cx="380" cy="240" r="7"/><circle cx="960" cy="400" r="7"/>
  </g>
  <g fill="#2b8a3e" stroke="#fff" stroke-width="1.5">
    <polygon points="900,440 914,448 914,464 900,472 886,464 886,448"/>
    <polygon points="440,480 454,488 454,504 440,512 426,504 426,488"/>
  </g>
  <!-- legend -->
  <rect fill="#fff" stroke="#999" x="1076" y="176" width="150" height="112" rx="4"/>
  <text class="ts" x="1088" y="194" font-weight="bold">Legend</text>
  <circle cx="1094" cy="210" r="5" fill="#1c7ed6"/><text class="ts" x="1106" y="214">Existing station</text>
  <polygon points="1094,222 1100,226 1100,232 1094,236 1088,232 1088,226" fill="#2b8a3e"/><text class="ts" x="1106" y="233">Proposed station</text>
  <line x1="1086" y1="250" x2="1102" y2="250" class="lane"/><text class="ts" x="1106" y="254">Has lane (direction)</text>
  <line x1="1086" y1="270" x2="1102" y2="270" class="gap"/><text class="ts" x="1106" y="274">Priority gap</text>
  <!-- popup -->
  <rect fill="#fff" stroke="#555" x="690" y="378" width="180" height="70" rx="4"/>
  <text class="ts" x="700" y="396" font-weight="bold">Corridor #3 · rank 3</text>
  <text class="ts" x="700" y="412">Direction: n1 → n3 (NE)</text>
  <text class="ts" x="700" y="426">Volume 1 240 · no lane</text>
  <text class="ts" x="700" y="440">Click for score breakdown</text>
  <text class="ts" x="266" y="578">⚠ Notes: tables read from test data (e.g. `edges` from tests/fixtures/sample_edges.parquet)</text>

  <!-- Detail panel: under the map -->
  <rect class="box" x="266" y="592" width="974" height="150" rx="4"/>
  <circle class="call" cx="282" cy="610" r="10"/><text class="num" x="278" y="614">7</text>
  <text class="th" x="300" y="616">Selected recommendation</text>
  <text class="ts" x="500" y="616">Filled when a map item is clicked</text>
  <g class="t">
    <text x="282" y="646">Type: corridor</text>
    <text x="282" y="668">Scenario: lane_aware</text>
    <text x="282" y="690">Rank: 3 of 25</text>
    <text x="282" y="712">Direction: n1 → n3</text>
    <text x="500" y="646">Lane in this direction: no</text>
    <text x="500" y="668">Route volume: 1 240</text>
    <text x="500" y="690">Gap length: 720 m</text>
    <text x="500" y="712">Continuity factor: 1.3</text>
  </g>
  <rect class="box-dark" x="740" y="632" width="234" height="44" rx="4"/>
  <text class="ts" x="750" y="650">Score = volume × gap length</text>
  <text class="ts" x="750" y="666">× continuity = 1 160 000</text>
  <text class="t" x="740" y="702">Robustness: all 3 scenarios</text>
  <rect x="1000" y="632" width="96" height="22" rx="11" fill="#d3f9d8" stroke="#2b8a3e"/>
  <text class="ts" x="1014" y="647">ROBUST</text>
  <text class="ts" x="1000" y="684">Station items show population,</text>
  <text class="ts" x="1000" y="698">lane connectivity and score.</text>

  <!-- Scenario comparison: all three maps always visible -->
  <rect class="ph" x="266" y="758" width="974" height="344" rx="4"/>
  <circle class="call" cx="282" cy="776" r="10"/><text class="num" x="278" y="780">8</text>
  <text class="th" x="300" y="782">Scenario comparison (maps in week 1, metrics in week 5)</text>
  <g>
    <rect class="box" x="282" y="796" width="306" height="170" rx="4"/>
    <text class="t" x="296" y="816">baseline</text>
    <rect class="map" x="296" y="826" width="278" height="126"/>
    <rect class="box" x="600" y="796" width="306" height="170" rx="4"/>
    <text class="t" x="614" y="816">lane_aware</text>
    <rect class="map" x="614" y="826" width="278" height="126"/>
    <rect class="box" x="918" y="796" width="306" height="170" rx="4"/>
    <text class="t" x="932" y="816">population_only</text>
    <rect class="map" x="932" y="826" width="278" height="126"/>
  </g>
  <rect class="box" x="282" y="978" width="942" height="110" rx="4"/>
  <g class="ts">
    <text x="296" y="998" font-weight="bold">Comparison metrics</text>
    <text x="560" y="998" font-weight="bold">baseline</text>
    <text x="680" y="998" font-weight="bold">lane_aware</text>
    <text x="800" y="998" font-weight="bold">population_only</text>
    <text x="296" y="1020">Total demand</text>
    <text x="560" y="1020">100%</text><text x="680" y="1020">+6%</text><text x="800" y="1020">+11%</text>
    <text x="296" y="1040">Demand / new person</text>
    <text x="560" y="1040">–</text><text x="680" y="1040">0.9</text><text x="800" y="1040">0.8</text>
    <text x="296" y="1060">New people / km</text>
    <text x="560" y="1060">–</text><text x="680" y="1060">1.9k</text><text x="800" y="1060">1.1k</text>
    <text x="296" y="1080">Robust corridors: 7 · Station-dependent: 5</text>
  </g>

  <!-- Tabs -->
  <circle class="call" cx="282" cy="1132" r="10"/><text class="num" x="278" y="1136">9</text>
  <rect class="box-dark" x="300" y="1116" width="150" height="30" rx="4"/><text class="t" x="320" y="1136">Top corridors</text>
  <rect class="box" x="456" y="1116" width="170" height="30" rx="4"/><text class="t" x="476" y="1136">Station candidates</text>
  <rect class="box" x="632" y="1116" width="230" height="30" rx="4"/><text class="t" x="652" y="1136">Methodology &amp; limitations</text>
  <rect class="box" x="266" y="1146" width="974" height="80" rx="4"/>
  <g class="ts">
    <text x="282" y="1168" font-weight="bold">rank</text>
    <text x="332" y="1168" font-weight="bold">corridor_id</text>
    <text x="432" y="1168" font-weight="bold">scenario</text>
    <text x="532" y="1168" font-weight="bold">direction</text>
    <text x="622" y="1168" font-weight="bold">volume</text>
    <text x="702" y="1168" font-weight="bold">gap length</text>
    <text x="792" y="1168" font-weight="bold">score</text>
    <text x="882" y="1168" font-weight="bold">robust?</text>
    <text x="282" y="1188">1</text>
    <text x="332" y="1188">c_014</text>
    <text x="432" y="1188">baseline</text>
    <text x="532" y="1188">N → S</text>
    <text x="622" y="1188">2 310</text>
    <text x="702" y="1188">1.2 km</text>
    <text x="792" y="1188">2.9 M</text>
    <text x="882" y="1188">yes</text>
    <text x="282" y="1208">2</text>
    <text x="332" y="1208">c_007</text>
    <text x="432" y="1208">baseline</text>
    <text x="532" y="1208">E → W</text>
    <text x="622" y="1208">1 980</text>
    <text x="702" y="1208">0.9 km</text>
    <text x="792" y="1208">2.1 M</text>
    <text x="882" y="1208">station-dependent</text>
  </g>
</svg>
