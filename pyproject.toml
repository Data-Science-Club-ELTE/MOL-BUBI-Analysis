[project]
name = "mol-bubi-recommender"
version = "0.1.0"
description = "MOL Bubi Bike-Lane and Station Recommendation Tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "folium>=0.17.0",
    "geopandas>=1.0.0",
    "h3>=4.0.0",
    "networkx>=3.2.0",
    "osmnx>=1.9.0",
    "pandera[geopandas]>=0.20.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "shapely>=2.0.0",
    "streamlit>=1.35.0",
    "streamlit-folium>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bubi"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
